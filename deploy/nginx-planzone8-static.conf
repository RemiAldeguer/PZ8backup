# Planzone 8: OIDC gateway; never serve the checkout or data/ directly.
server {
    listen 80;
    listen [::]:80;
    server_name planzone8.codex.f10web.com;
    return 301 https://planzone8.codex.f10web.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name planzone8.codex.f10web.com;

    ssl_certificate /home/planzone/.letsencrypt/config/live/codex.f10web.com/fullchain.pem;
    ssl_certificate_key /home/planzone/.letsencrypt/config/live/codex.f10web.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Every asset request must pass through the OIDC gate (no static root fallback).
    # The gateway sets COOP/COEP exactly once on assets (duplicate values break OPFS).
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The only live API route forwards the server-held CAS token to core.
    location = /api/planzones/current {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
    }
    # The retired Express API must never fall through to a static index page.
    location = /api { return 410; }
    location ^~ /api/ { return 410; }
    # Even if a private database is accidentally copied, refuse to publish it.
    location ~* \.(?:sqlite|sqlite3|db|wal|shm)$ { return 404; }
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass_request_headers on;
        proxy_redirect off;
    }
}
