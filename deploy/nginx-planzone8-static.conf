# Planzone 8: static browser-only application. NEVER serve the checkout or data/.
server {
    listen 80;
    listen [::]:80;
    server_name planzone8.codex.f10web.com;
    return 301 https://planzone8.codex.f10web.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name planzone8.codex.f10web.com;

    ssl_certificate /home/planzone/.letsencrypt/config/live/codex.f10web.com/fullchain.pem;
    ssl_certificate_key /home/planzone/.letsencrypt/config/live/codex.f10web.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/planzone8-static;
    index index.html;
    autoindex off;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;

    # The retired Express API must never fall through to a static index page.
    location = /api { return 410; }
    location ^~ /api/ { return 410; }
    # Even if a private database is accidentally copied, refuse to publish it.
    location ~* \.(?:sqlite|sqlite3|db|wal|shm)$ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
