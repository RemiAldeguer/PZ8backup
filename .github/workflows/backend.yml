name: Backend Java

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/local/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, refactor/foundation]
    paths:
      - "backend/**"
      - "deploy/local/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle.kts
            backend/gradle/locks/*.lockfile
            backend/gradle/verification-metadata.xml
      - name: Verify code and PostgreSQL isolation
        run: bash ./gradlew --no-daemon check :core:integrationTest :api:integrationTest :api:bootJar :jobs:bootJar
      - name: Validate local database configuration
        working-directory: .
        env:
          PZ8_POSTGRES_PASSWORD: configuration-validation-only
        run: docker compose -p pz8-ci -f deploy/local/compose.yaml config --quiet
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7
